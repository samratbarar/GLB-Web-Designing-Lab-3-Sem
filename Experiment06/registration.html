<!DOCTYPE html>
<html>

<head>
    <title>Registration Form</title>
</head>

<body align="center" bgcolor="#9BCEC1">
    <table border="4" align="center" bgcolor="#F4F6F9">
        <tr>
            <td>
                <h1><b>Registration Form</b></h1>

                <form onsubmit="return validate()">

                    Name:
                    <input type="text" id="name">
                    <br><br>
                    <br><br>

                    Password:
                    <input type="password" id="password">
                    <br><br>
                    <br><br>

                    <input type="submit" value="Register">

                </form>
            </td>
        </tr>
    </table>

    <script>

        function validate() {

            let name = document.getElementById("name").value;
            let password = document.getElementById("password").value;

            // Name should contain only alphabets
            if (!/^[A-Za-z]+$/.test(name)) {
                alert("Name should contain only alphabets");
                return false;
            }

            // Name length should be greater than 6
            if (name.length < 6) {
                alert("Name should not be less than 6 characters");
                return false;
            }

            // Password length should be greater than 6
            if (password.length < 6) {
                alert("Password should not be less than 6 characters");
                return false;
            }

            alert("Registration Successful");
            return true;
        }

    </script>

</body>

</html>
