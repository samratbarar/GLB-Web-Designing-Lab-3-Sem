<!DOCTYPE html>
<html>

<head>
    <title>Registration Page</title>
</head>

<body align="center" bgcolor="#9BCEC1">
    <table border="4" align="center" bgcolor="#F4F6F9">
        <tr>
            <td>
                <h1 align="center"><b>Registration Page</b></h1>
                <form align="center" onsubmit="return validate()">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name">
                    <br><br>

                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password">
                    <br><br>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email address">
                    <br><br>

                    <label for="phonenum">Phone Number:</label>
                    <input type="tel" id="phonenum" name="phonenum" placeholder="Enter your phone number">
                    <br><br>

                    <label for="sex">Sex:</label>
                    <input type="radio" id="male" name="sex" value="male">
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="sex" value="female">
                    <label for="female">Female</label>
                    <br><br>

                    <label for="DOB">Date of Birth:</label>
                    <input type="date" name="Date">
                    <br><br>

                    <label for="lang">Language known:</label>
                    <input type="checkbox" id="English" name="lang" value="English">
                    <label for="English">English</label>
                    <input type="checkbox" id="Hindi" name="lang" value="hindi">
                    <label for="Hindi">Hindi</label>
                    <input type="checkbox" id="Urdu" name="lang" value="Urdu">
                    <label for="Urdu">Urdu</label>
                    <br><br>

                    <label for="Address">Address:</label>
                    <input type="textarea" id="Address" name="Address" placeholder="Enter your address">
                    <br><br>

                    <input type="submit" value="Register">
                    <input type="reset" value="Reset">
                </form>
            </td>
        </tr>
    </table>

    <script>

        function validate() {

            let name = document.getElementById("name").value;
            let password = document.getElementById("password").value;
            let email = document.getElementById("email").value;
            let phone = document.getElementById("phonenum").value;

            // Name should contain only alphabets
            if (!/^[A-Za-z]+$/.test(name)) {
                alert("Name should contain only alphabets");
                return false;
            }

            // Name length should be greater than 6
            if (name.length < 6) {
                alert("Name should not be less than 6 characters");
                return false;
            }

            // Password length should be greater than 6
            if (password.length < 6) {
                alert("Password should not be less than 6 characters");
                return false;
            }


            if (!/^[A-Za-z]+$/.test(name)) {
                alert("Name should contain only alphabets");
                return false;
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                alert("Enter a valid email");
                return false;
            } 
            
            if (!/^[0-9]{10}$/.test(phone)) {
                alert("Phone number must contain exactly 10 digits");
                return false;
            }

            alert("Registration Successful");
            return true;
        }

    </script>
</body>

</html>
