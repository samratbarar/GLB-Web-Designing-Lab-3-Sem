<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>

<body>
    <table border="4" align="center" bgcolor="#F4F6F9">
        <tr>
            <td align="center">
                <h1>Online Book Store Login</h1>
                <form action="/Experiment02/files/info.txt">
                    <label for="username">Username : </label>

                    <label for="password">Password:</label>

                    <br><br>

                    <input type="submit" value="Submit" align="center">
                    
                    <a href="forgetpassword.html">Forget Password</a>
                </form>
            </td>
        </tr>
    </table>
</body>

</html>
